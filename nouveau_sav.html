<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" integrity="anonymous" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="components/header.js" type="text/javascript" defer></script>
    <script src="components/footer.js" type="text/javascript" defer></script>
    <title>Ouverture d'un SAV</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .form-container {
            width: 50%;
            margin: auto;
            border: 2px solid #2c3e50;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 2px 2px 12px rgba(0, 0, 0, 0.1);
        }
        .form-container h2 {
            text-align: center;
            color: #2980b9;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-group textarea {
            resize: vertical;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            color: #fff;
            background-color: #2980b9;
            border-radius: 5px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            margin-top: 20px;
            display: block;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>

<header-component></header-component>
    <div class="form-container">
        <h2>Ouverture d'un SAV</h2>
        <form>
            <div class="form-group">
                <label>N° de ticket:</label>
                <input type="text" placeholder="Entrez le N° de ticket">
            </div>
            <div class="form-group">
                <label>Date:</label>
                <input type="date">
            </div>
            <div class="form-group">
                <label>Agence:</label>
                <input type="text" placeholder="Entrez l'agence">
            </div>
            <div class="form-group">
                <label>Problème:</label>
                <textarea placeholder="Décrivez le problème"></textarea>
            </div>
            <a href="#" class="btn">Créer</a>
        </form>
    </div>

<footer-component></footer-component>

</body>
</html>
