<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" integrity="anonymous" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="components/header.js" type="text/javascript" defer></script>
    <script src="components/footer.js" type="text/javascript" defer></script>
    <link rel="stylesheet" href="css/nouveau_sav_styles.css">
    <title>Ouverture d'un SAV</title>
</head>
<body>

<header-component></header-component>
    <div class="form-container">
        <h2>Ouverture d'un SAV</h2>
        <form>
            <div class="form-group">
                <label>N° de ticket:</label>
                <input type="text" placeholder="#00005">
            </div>
            <div class="form-group">
                <label>Date:</label>
                <input type="date">
            </div>
            <div class="form-group">
                <label>Agence:</label>
                <input type="text" placeholder="Entrez l'agence">
            </div>
            <div class="form-group">
                <label>Problème:</label>
                <textarea placeholder="Décrivez le problème"></textarea>
            </div>
            <a href="#" class="btn">Créer</a>
        </form>
    </div>

<footer-component></footer-component>

</body>
</html>
