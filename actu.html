<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="css/actu_styles.css" rel="stylesheet" type="text/css" />
  <script src="components/header.js" type="text/javascript" defer></script>
  <script src="components/footer.js" type="text/javascript" defer></script>
  <title>Création d'Actualité</title>
</head>
<body>
  <!-- Header -->
  <header-component></header-component>

  <!-- Main Content -->
  <main>
    <section class="news-form-container">
      <h2>Créer une nouvelle actualité</h2>
      <form class="news-form" onsubmit="return handleSubmit(event)">
        <div class="form-group">
          <label for="news-title">Titre de l'actualité</label>
          <input type="text" id="news-title" placeholder="Entrez le titre de l'actualité" required>
        </div>

        <div class="form-group">
          <label for="news-content">Contenu de l'actualité</label>
          <textarea id="news-content" placeholder="Entrez le contenu de l'actualité" rows="5" required></textarea>
        </div>

        <!-- Image Upload Section -->
        <div class="form-group">
          <label for="news-image">Sélectionner une image</label>
          <input type="file" id="news-image" accept="image/*">
          <div id="drop-area">ou glissez-déposez l'image ici</div>
          <img id="preview-image" src="" alt="Aperçu de l'image" style="display: none;" />
        </div>

        <div class="form-group">
          <label for="news-link">Lien pour "En savoir plus"</label>
          <input type="text" id="news-link" placeholder="Entrez le lien (URL)" required>
        </div>

        <div class="form-group">
          <label for="news-date">Date de publication</label>
          <input type="date" id="news-date" required>
        </div>

        <button type="submit">Ajouter l'actualité</button>
      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer-component></footer-component>

  <script>
    // JavaScript pour la gestion de l'image drag & drop et aperçu
    const dropArea = document.getElementById('drop-area');
    const newsImage = document.getElementById('news-image');
    const previewImage = document.getElementById('preview-image');

    dropArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropArea.style.backgroundColor = '#f0fff0';
    });

    dropArea.addEventListener('dragleave', () => {
      dropArea.style.backgroundColor = '#fff';
    });

    dropArea.addEventListener('drop', (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      handleImage(file);
    });

    newsImage.addEventListener('change', (e) => {
      const file = e.target.files[0];
      handleImage(file);
    });

    function handleImage(file) {
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = function (e) {
          previewImage.src = e.target.result;
          previewImage.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    function handleSubmit(event) {
      event.preventDefault(); // Empêche la soumission du formulaire par défaut
      // Vérifie que tous les champs sont remplis
      const title = document.getElementById('news-title').value;
      const content = document.getElementById('news-content').value;
      const link = document.getElementById('news-link').value;
      const date = document.getElementById('news-date').value;
      
      if (title && content && link && date) {
        alert('L\'actualité a été créée avec succès!');
        // Ici tu peux ajouter du code pour envoyer les données à un serveur si nécessaire
        // Pour l'exemple, le formulaire ne sera pas réellement soumis
        // event.target.submit(); // Décommente ceci si tu veux soumettre réellement le formulaire
      } else {
        alert('Veuillez remplir tous les champs.');
      }
      return false; // Empêche le formulaire de se soumettre par défaut
    }
  </script>
</body>
</html>
