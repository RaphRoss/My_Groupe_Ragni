<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="css/affaire_styles.css" rel="stylesheet" type="text/css" />
  <script src="components/header.js" type="text/javascript" defer></script>
  <script src="components/footer.js" type="text/javascript" defer></script>
  <title>Modification d'Affaire</title>
  <style>
    /* Style pour les champs grisés */
    .disabled {
      background-color: #8f8c8c;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header-component></header-component>

  <!-- Content -->
  <div class="header">
    <h1>Modification d'Affaire</h1>
  </div>

  <div class="form-container">
    <form id="affaireForm" action="/creer_devis.html" method="POST">
      <label for="nom_affaire">Nom de l’affaire</label>
      <input type="text" id="nom_affaire" name="nom_affaire" value="Affaire 1" disabled>

      <label for="ville">Ville</label>
      <input type="text" id="ville" name="ville" value="Nice" disabled>

      <label for="code_postal">Code postal</label>
      <input type="text" id="code_postal" name="code_postal" value="06000" disabled>

      <label for="pays">Pays</label>
      <input type="text" id="pays" name="pays" value="France" disabled>

      <label for="budget">Montant/budget Estimé</label>
      <input type="text" id="budget" name="budget" value="12000€" disabled>

      <label for="date_realisation">Date estimée de réalisation</label>
      <input type="text" id="date_realisation" name="date_realisation" value="30/09/2024" disabled>

      <!-- Les boutons sont tous visibles dès le début -->
      <div class="buttons">
        <a href="gestion_devis.html"><button type="button">Création d’un devis</button></a>
        <a href="https://www.mynovea.com/"><button type="button">Demande MyNovea</button></a>
        <a href="#"><button type="button">Demande SEVe</button></a>
        <a href="etude.html"><button type="button">Demande d’étude : info/meca/photo/spé</button></a>
        <a href="#"><button type="button">Configurateur 3D</button></a>
      </div>
    </form>

    <div class="devis-list">
      <h2></h2>
      <ul>
        <li></li>
        <li></li>
      </ul>
    </div>
  </div>

  <!-- Footer -->
  <footer-component></footer-component>
</body>
</html>
