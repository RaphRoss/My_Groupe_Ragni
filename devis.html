<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Création de Devis</title>
    <link rel="stylesheet" href="css/devis_styles.css">
    <script src="components/header.js" type="text/javascript" defer></script>
    <script src="components/footer.js" type="text/javascript" defer></script>
</head>

<body>
    <header-component></header-component>
    <div class="container">
        <h1>Création de Devis</h1>
        <p>Remplissez le formulaire ci-dessous pour créer un nouveau devis</p>
        <form id="devis-form">
            <label for="nom">Nom:</label>
            <input type="text" id="nom" name="nom" required>
            <label for="prenom">Prénom:</label>
            <input type="text" id="prenom" name="prenom" required>
            <label for="ville">Ville:</label>
            <input type="text" id="ville" name="ville" required>
            <label for="date-livraison">Date de Livraison:</label>
            <input type="date" id="date-livraison" name="date-livraison" required>

            <div class="section">
                <h2>Choisissez vo(s)tre produit(s):</h2>
                <div class="buttons-group">
                    <a href="#" class="btn" id="ensemble-btn">Ensemble</a>
                    <a href="#" class="btn" id="composant-btn">Composant</a>
                    <a href="#" class="btn" id="korner-btn">Korner</a>
                    <a href="#" class="btn" id="salon-btn">Salon Nocturne</a>
                    <a href="#" class="btn large" id="config-seve-btn">Configurateur SEVe</a>
                </div>
            </div>

            <div class="section">
                <h2>Vo(s)tre produit(s):</h2>
                <div class="add-remove-buttons">
                  <button type="button" id="add-line" class="btn small">+</button>
                  <button type="button" id="remove-line" class="btn small">-</button>
                </div>
                <div id="products-list">
                    <!-- Les lignes de produits seront ajoutées ici via JavaScript -->
                </div>
            </div>

            <div class="submit-buttons">
                <button type="submit" class="btn">Créer votre devis</button>
                <button type="button" id="return-button" class="btn">Retour à la création d'affaire</button>
            </div>
        </form>
    </div>
    <footer-component></footer-component>

    <script src="components/devis.js"></script>
</body>

</html>
