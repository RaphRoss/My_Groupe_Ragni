<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" integrity="sha512-+4zCK9k+qNFUR5X+cKL9EIR+ZOhtIloNl9GIKS57V1MyNsYpYcUrUeQc9vNfzsWfV28IaLL3i96P9sdNyeRssA==" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="css/B2B_commande_styles.css" rel="stylesheet" type="text/css" />
    <script src="components/header.js" type="text/javascript" defer></script>
    <script src="components/footer.js" type="text/javascript" defer></script>
    <title>B2B-commande</title>
</head>
<body>
    <!-- Header -->
    <header-component></header-component>

    <!-- Content -->
    <h1>Tableau de vos commande</h1>

    <!-- Filter -->
    <div class="filter-container">
        <label for="filterInput">Filtrer :</label>
        <input type="text" id="filterInput" onkeyup="filterTable()" placeholder="Rechercher une commande...">
    </div>

    <table id="dataTable">
        <thead>
            <tr>
                <th onclick="sortTable(0)">Nom</th>
                <th onclick="sortTable(1)">Ville</th>
                <th onclick="sortTable(2)">Coût</th>
                <th onclick="sortTable(3)">Statuts</th>
                <th onclick="sortTable(4)">Marque</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Jean Dupont</td>
                <td>Paris</td>
                <td>1500€</td>
                <td>En cours</td>
                <td>Ragni</td>
            </tr>
            <tr>
                <td>Marie Curie</td>
                <td>Lille</td>
                <td>2300€</td>
                <td>Terminer</td>
                <td>Vulkan</td>
            </tr>
            <tr>
                <td>Jacques Chirac</td>
                <td>Marseille</td>
                <td>1750€</td>
                <td>En attente</td>
                <td>Novea</td>
            </tr>
            <tr>
                <td>Luc Besson</td>
                <td>Bordeaux</td>
                <td>3000€</td>
                <td>Terminer</td>
                <td>SEVe</td>
            </tr>
            <tr>
                <td>Anna Martin</td>
                <td>Lyon</td>
                <td>2100€</td>
                <td>En cours</td>
                <td>Hess</td>
            </tr>
        </tbody>
    </table>

    <!-- Footer -->
    <footer-component></footer-component>

    <script>
        function sortTable(n) {
            const table = document.getElementById("dataTable");
            const rows = Array.from(table.querySelectorAll("tbody tr"));
            const th = table.querySelectorAll("th");
            const currentIsAsc = th[n].classList.contains("sort-asc");

            // Remove sorting classes from all headers
            th.forEach(header => header.classList.remove("sort-asc", "sort-desc"));

            // Sort rows
            rows.sort((rowA, rowB) => {
                const cellA = rowA.cells[n].innerText.trim();
                const cellB = rowB.cells[n].innerText.trim();

                if (n === 2) { // For cost, convert to number
                    return currentIsAsc ? parseFloat(cellA.replace("€", "")) - parseFloat(cellB.replace("€", "")) : parseFloat(cellB.replace("€", "")) - parseFloat(cellA.replace("€", ""));
                }

                if (cellA > cellB) return currentIsAsc ? 1 : -1;
                if (cellA < cellB) return currentIsAsc ? -1 : 1;
                return 0;
            });

            // Add sorted rows back to the table
            rows.forEach(row => table.querySelector("tbody").appendChild(row));

            // Update header sorting indicator
            th[n].classList.add(currentIsAsc ? "sort-desc" : "sort-asc");
        }

        function filterTable() {
            const input = document.getElementById("filterInput");
            const filter = input.value.toUpperCase();
            const table = document.getElementById("dataTable");
            const rows = table.querySelectorAll("tbody tr");

            rows.forEach(row => {
                const cells = row.getElementsByTagName("td");
                let textContent = "";
                for (let i = 0; i < cells.length; i++) {
                    textContent += cells[i].textContent || cells[i].innerText;
                }
                if (textContent.toUpperCase().indexOf(filter) > -1) {
                    row.style.display = "";
                } else {
                    row.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
